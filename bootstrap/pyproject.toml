[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "praktika-controller"
# Version is kept in lockstep with praktika (single source of truth: `version` in
# the root pyproject.toml). It is supplied at build time by setup.py, which reads
# that root version — hence `dynamic` here rather than a hardcoded string.
dynamic = ["version"]
description = "Thin controller for launching versioned Praktika workloads"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.18.0",
    "PyJWT>=2.4.0",
    "cryptography>=42.0.0",
    "requests>=2.25.0",
]

[project.urls]
Homepage = "https://github.com/ClickHouse/praktika"
Repository = "https://github.com/ClickHouse/praktika"
Issues = "https://github.com/ClickHouse/praktika/issues"

[project.scripts]
praktika-controller = "praktika_controller.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["praktika_controller*"]
